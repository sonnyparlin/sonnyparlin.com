<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found · Sonny Parlin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f1eee9">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/sp-logo-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/sp-logo-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { overflow: hidden; }
    .nf { position: relative; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 14px var(--gutter) 28px; }
    .nf .nav { position: static; padding: 0; margin-bottom: 0; grid-template-columns: auto 1fr; }
    .nf .cell.live { display: flex; justify-content: flex-end; }
    .nf-body { display: grid; place-items: center; text-align: center; padding: 40px 0; position: relative; z-index: 1; }
    .nf-body h1 { font: 600 clamp(56px, 11vw, 150px)/0.95 var(--head); letter-spacing: -0.05em; margin: 0 0 18px; }
    .nf-body h1 em { font-style: normal; color: var(--blue); }
    .nf-body p { color: var(--ink-2); max-width: 460px; margin: 0 auto 30px; font-size: 18px; }
    .nf-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .nf-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 500 13px var(--body); color: var(--ink-3); position: relative; z-index: 1; }
    /* The logo, huge and faint, sliding across the floor like it got swept */
    .bg-logo { position: absolute; left: 50%; top: 52%; width: min(70vw, 620px); aspect-ratio: 1; transform: translate(-50%, -50%) rotate(-12deg); opacity: 0.07; pointer-events: none; z-index: 0; animation: sweep 14s ease-in-out infinite alternate; }
    .bg-logo img { width: 100%; height: 100%; }
    @keyframes sweep { from { transform: translate(-58%, -50%) rotate(-14deg); } to { transform: translate(-42%, -50%) rotate(-6deg); } }
    /* Belt stripe that follows the cursor a little */
    .belt { position: absolute; left: 0; right: 0; top: 50%; height: 14px; background: #151515; opacity: 0.9; transform: translateY(-50%) rotate(-3deg) scaleX(1.1); z-index: 0; pointer-events: none; }
    .belt::after { content: ""; position: absolute; right: 12%; top: 0; bottom: 0; width: 7%; background: #c8102e; }
    .belt::before { content: ""; position: absolute; right: 19.5%; top: 0; bottom: 0; width: 1.2%; background: repeating-linear-gradient(90deg, #fff 0 33%, transparent 33% 66%, #fff 66% 100%); }
    .nf-body .mark { width: 96px; height: 96px; margin: 0 auto 28px; border-radius: 50%; box-shadow: 0 16px 40px rgba(25,25,25,0.22); animation: tilt 6s ease-in-out infinite; }
    @keyframes tilt { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { .bg-logo, .nf-body .mark { animation: none; } }
    @media (max-width: 640px) { .belt { display: none; } .nf-body .mark { width: 76px; height: 76px; } }
  </style>
</head>
<body>
  <main class="nf">
    <header class="nav">
      <a href="/" class="cell name"><img class="mark" src="/img/sp-logo.png" alt="" width="28" height="28">Sonny Parlin</a>
      <div class="cell live"><span>404</span></div>
    </header>

    <div class="bg-logo" aria-hidden="true"><img src="/img/sp-logo-512.png" alt=""></div>
    <div class="belt" aria-hidden="true"></div>

    <div class="nf-body">
      <div>
        <img class="mark" src="/img/sp-logo.png" alt="SP monogram" width="96" height="96">
        <h1>You got <em>swept.</em></h1>
        <p>That page doesn't exist, or it tapped out a while ago. Everything about me lives on one page anyway, and it's one click away.</p>
        <div class="nf-actions">
          <a class="pill" href="/">Back to the mat</a>
          <a class="pill ghost" href="https://graciebradenton.com" target="_blank" rel="noopener">Gracie Bradenton</a>
        </div>
      </div>
    </div>

    <footer class="nf-foot">
      <span>sonnyparlin.com</span>
      <span>Error 404 · Position lost, not the match</span>
    </footer>
  </main>
</body>
</html>
